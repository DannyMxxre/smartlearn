<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ИИ-Наставник</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    .message-user { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .message-ai { background: #1f2937; border: 1px solid #374151; }
    .message-ai .md { font-size: 0.95rem; line-height: 1.65; }
    .message-ai .md > :first-child { margin-top: 0; }
    .message-ai .md > :last-child { margin-bottom: 0; }
    .message-ai .md p { margin: 0.7em 0; }
    .message-ai .md h2, .message-ai .md h3 {
      font-size: 0.98rem; font-weight: 650; letter-spacing: -0.01em;
      margin: 1.05em 0 0.4em; color: #f9fafb;
    }
    .message-ai .md ul, .message-ai .md ol { margin: 0.35em 0 0.8em; padding-left: 1.25em; }
    .message-ai .md li { margin: 0.28em 0; }
    .message-ai .md li::marker { color: #9ca3af; }
    .message-ai .md a { color: #93c5fd; text-decoration: underline; text-underline-offset: 3px; }
    .message-ai .md a:hover { color: #bfdbfe; }
    .message-ai .md strong { color: #fff; font-weight: 600; }
    .message-ai .md code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #111827; border: 1px solid #374151; border-radius: 6px;
      padding: 0.08em 0.35em; font-size: 0.86em;
    }
    .message-ai .md pre {
      background: #111827; border: 1px solid #374151; border-radius: 12px;
      padding: 0.85em 1em; overflow-x: auto; margin: 0.75em 0;
    }
    .message-ai .md pre code { background: transparent; border: 0; padding: 0; }
    .message-ai .md blockquote {
      border-left: 3px solid #4b5563; margin: 0.75em 0; padding-left: 0.85em; color: #d1d5db;
    }
    .message-ai .md hr { border: 0; border-top: 1px solid #374151; margin: 0.95em 0; }
    .sidebar-card { background: #111827; border: 1px solid #1f2937; }
    .progress-bar { transition: width 0.5s ease; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex overflow-hidden">

  <aside class="w-80 bg-gray-900 border-r border-gray-800 flex flex-col hidden md:flex">
    <div class="p-5 border-b border-gray-800">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500 to-amber-500 flex items-center justify-center text-xl">
          <i class="fa-solid fa-robot"></i>
        </div>
        <div>
          <h1 class="font-semibold text-lg">ИИ-Наставник</h1>
          <p class="text-xs text-gray-400">S8 Capital • Хакатон Demo</p>
        </div>
      </div>
    </div>

    <div class="p-5 space-y-4">
      <div class="sidebar-card rounded-xl p-4">
        <div class="text-xs text-gray-400 mb-1">Роль</div>
        <div class="font-medium flex items-center gap-2">
          <i class="fa-solid fa-user-tie text-blue-400"></i>
          <span id="current-role">Не выбрана</span>
        </div>
      </div>

      <div id="level-card" class="sidebar-card rounded-xl p-4">
        <div class="flex justify-between items-center mb-2">
          <div class="text-xs text-gray-400">Уровень</div>
          <div class="text-sm font-semibold text-emerald-400" id="level-badge">—</div>
        </div>
        <div class="w-full bg-gray-800 rounded-full h-2">
          <div id="level-bar" class="progress-bar bg-gradient-to-r from-emerald-500 to-teal-400 h-2 rounded-full" style="width: 0%"></div>
        </div>
        <div id="score-label" class="text-xs text-gray-500 mt-1 text-right">0 / 12</div>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto p-5 space-y-5 chat-scroll">
      <div>
        <h3 class="text-sm font-semibold text-gray-300 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-triangle-exclamation text-rose-400"></i> Пробелы в знаниях
        </h3>
        <div id="gaps-list" class="space-y-2 text-sm"></div>
      </div>

      <div>
        <h3 class="text-sm font-semibold text-gray-300 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-map text-amber-400"></i> План на месяц
        </h3>
        <div id="roadmap-list" class="space-y-2 text-sm"></div>
      </div>

      <div>
        <h3 class="text-sm font-semibold text-gray-300 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-graduation-cap text-purple-400"></i> Курсы
        </h3>
        <div id="courses-list" class="space-y-2 text-sm"></div>
      </div>
    </div>

    <div class="p-4 border-t border-gray-800">
      <div class="flex items-center justify-between text-xs">
        <div class="flex items-center gap-2">
          <span id="ai-status-dot" class="w-2.5 h-2.5 rounded-full bg-gray-500"></span>
          <span id="ai-status-text" class="text-gray-400">проверяю</span>
        </div>
        <span class="text-gray-600">YandexGPT</span>
      </div>
    </div>
  </aside>

  <main class="flex-1 flex flex-col">
    <header class="h-16 border-b border-gray-800 flex items-center justify-between px-6 bg-gray-900/50 backdrop-blur">
      <div>
        <div class="font-medium">Диагностика навыков</div>
        <div id="phase-label" class="text-xs text-gray-400">Подключение</div>
      </div>
      <button id="restart" type="button" class="px-3 py-1 rounded-full bg-gray-800 text-gray-300 text-xs hover:bg-gray-700">
        Новая сессия
      </button>
    </header>

    <div id="messages" class="flex-1 overflow-y-auto p-6 space-y-6 chat-scroll"></div>

    <div class="p-4 border-t border-gray-800 bg-gray-900/80">
      <div class="max-w-3xl mx-auto">
        <div class="flex items-end gap-3 bg-gray-800 rounded-2xl p-2 focus-within:ring-2 focus-within:ring-blue-500/50">
          <textarea
            id="user-input"
            rows="1"
            placeholder="Напишите сообщение..."
            class="flex-1 bg-transparent resize-none outline-none px-3 py-2 text-sm max-h-32"
          ></textarea>
          <button id="send" type="button" class="w-10 h-10 rounded-xl bg-blue-600 hover:bg-blue-500 flex items-center justify-center transition disabled:opacity-40">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
        <div class="text-xs text-gray-500 text-center mt-2">
          Курсы под слабые темы появляются после диагностики.
        </div>
      </div>
    </div>
  </main>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("user-input");
    const sendEl = document.getElementById("send");
    let sessionId = null;
    let busy = false;

    const phaseNames = {
      intro: "Знакомство",
      diagnosis: "Диагностика",
      report: "Отчёт и план"
    };

    document.getElementById("restart").addEventListener("click", () => startSession());
    sendEl.addEventListener("click", () => submitInput());
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 128) + "px";
    });
    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        submitInput();
      }
    });
    startSession();
    resetSidebar();

    function startSession() {
      sessionId = null;
      messagesEl.replaceChildren();
      resetSidebar();
      document.getElementById("phase-label").textContent = "Подключение";
      refreshYandexStatus();
      postMessage("", false);
    }

    function submitInput() {
      const text = inputEl.value.trim();
      if (!text) {
        return;
      }
      inputEl.value = "";
      inputEl.style.height = "auto";
      postMessage(text, true);
    }

    async function postMessage(text, showUser) {
      if (busy) {
        return;
      }
      busy = true;
      sendEl.disabled = true;
      if (showUser) {
        addMessage(text, true);
      }
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId, message: text })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          addMessage(data.error || "Бэкенд не принял сообщение.", false);
          return;
        }
        sessionId = data.sessionId;
        addMessage(data.reply, false, data.phase === "intro" && !data.role);
        applyState(data);
      } catch (error) {
        addMessage("Не удалось связаться с бэкендом. Запусти сервер и обнови страницу.", false);
        setStatus("off", "не удалось проверить");
      } finally {
        busy = false;
        sendEl.disabled = false;
        inputEl.focus();
      }
    }

    function addMessage(text, isUser, withRoles) {
      const row = document.createElement("div");
      row.className = "flex gap-4 max-w-3xl" + (isUser ? " ml-auto flex-row-reverse" : "");

      const avatar = document.createElement("div");
      avatar.className = "w-9 h-9 rounded-full flex-shrink-0 flex items-center justify-center " +
        (isUser ? "bg-blue-600" : "bg-gradient-to-br from-orange-500 to-amber-500");
      const icon = document.createElement("i");
      icon.className = "fa-solid text-sm " + (isUser ? "fa-user" : "fa-robot");
      avatar.appendChild(icon);

      const bubble = document.createElement("div");
      bubble.className = (isUser ? "message-user rounded-tr-sm" : "message-ai rounded-tl-sm") +
        " rounded-2xl px-5 py-3.5 max-w-[85%]";
      bubble.appendChild(isUser ? plainText(text) : markdownBody(text));
      if (withRoles) {
        bubble.appendChild(roleButtons());
      }

      row.append(avatar, bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function plainText(text) {
      const paragraph = document.createElement("p");
      paragraph.className = "whitespace-pre-wrap";
      paragraph.textContent = text;
      return paragraph;
    }

    function markdownBody(text) {
      const body = document.createElement("div");
      body.className = "md";
      if (typeof marked === "undefined" || typeof DOMPurify === "undefined") {
        body.appendChild(plainText(text));
        return body;
      }
      body.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
      body.querySelectorAll("a").forEach((link) => {
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      });
      return body;
    }

    function roleButtons() {
      const actions = document.createElement("div");
      actions.className = "flex gap-2 mt-3";
      actions.dataset.roleActions = "true";
      for (const role of ["Аналитик", "Разработчик"]) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = role;
        button.className = role === "Аналитик"
          ? "px-4 py-2 rounded-lg bg-blue-600/20 hover:bg-blue-600/40 text-blue-300 text-sm transition"
          : "px-4 py-2 rounded-lg bg-purple-600/20 hover:bg-purple-600/40 text-purple-300 text-sm transition";
        button.addEventListener("click", () => {
          actions.remove();
          postMessage(role, true);
        });
        actions.appendChild(button);
      }
      return actions;
    }

    function applyState(data) {
      const role = data.role === "analyst" ? "Аналитик" : data.role === "developer" ? "Разработчик" : "Не выбрана";
      document.getElementById("current-role").textContent = role;
      if (data.role) {
        document.querySelectorAll("[data-role-actions]").forEach((node) => node.remove());
      }

      let phase = phaseNames[data.phase] || "Диалог";
      if (data.phase === "diagnosis" && data.questionNumber) {
        phase = "Диагностика · задание " + data.questionNumber + " из " + data.questionCount;
      }
      document.getElementById("phase-label").textContent = phase;

      if (data.report) {
        fillReport(data.report);
      }
    }

    function fillReport(report) {
      document.getElementById("level-badge").textContent = report.level;
      const maxScore = report.maxScore || 12;
      const width = Math.max(0, Math.min(100, Math.round((report.score / maxScore) * 100)));
      document.getElementById("level-bar").style.width = width + "%";
      document.getElementById("score-label").textContent = report.score + " / " + maxScore;

      fillGapCards(report.answers);

      fillCards(document.getElementById("roadmap-list"), report.plan, (week) => {
        const card = document.createElement("div");
        card.className = "sidebar-card rounded-lg p-3";
        const title = document.createElement("div");
        title.className = "font-medium";
        title.textContent = week.week + ". " + week.title;
        card.appendChild(title);
        const steps = document.createElement("ul");
        steps.className = "text-xs text-gray-400 mt-1.5 space-y-1";
        for (const step of week.steps || []) {
          const item = document.createElement("li");
          item.textContent = step;
          steps.appendChild(item);
        }
        card.appendChild(steps);
        return card;
      }, "План появится после диагностики");
      fillCourses(report.courses);
    }

    function fillGapCards(answers) {
      const container = document.getElementById("gaps-list");
      const gaps = (answers || []).filter((answer) => answer.score <= 1);
      container.replaceChildren();
      if (gaps.length === 0) {
        container.appendChild(note("Пробелов нет"));
        return;
      }
      for (const gap of gaps) {
        const card = document.createElement("div");
        card.className = "sidebar-card rounded-lg p-3 border-l-4 border-rose-500";
        card.dataset.questionId = gap.questionId;
        const title = document.createElement("div");
        title.className = "font-medium";
        title.textContent = gap.title;
        const reason = document.createElement("div");
        reason.className = "text-xs text-rose-300 mt-1";
        reason.textContent = gap.score + " из 3 · " + (gap.reason || "нужно подтянуть");
        card.append(title, reason);
        container.appendChild(card);
      }
    }

    function fillCourses(courses) {
      const container = document.getElementById("courses-list");
      container.replaceChildren();
      if (!courses || courses.length === 0) {
        container.appendChild(note("Явных пробелов нет, отдельные курсы не нужны"));
        return;
      }
      for (const course of courses) {
        const link = document.createElement("a");
        link.href = course.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.className = "block sidebar-card rounded-lg p-3 hover:border-purple-500/50 transition group";
        const title = document.createElement("div");
        title.className = "font-medium group-hover:text-purple-300";
        title.textContent = course.title;
        const meta = document.createElement("div");
        meta.className = "flex items-center gap-2 mt-1.5";
        const badge = document.createElement("span");
        badge.className = course.free
          ? "text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300"
          : "text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300";
        badge.textContent = course.free ? "Бесплатно" : "Платно";
        const provider = document.createElement("span");
        provider.className = "text-xs text-gray-400";
        provider.textContent = course.provider + " • неделя " + course.week;
        meta.append(badge, provider);
        link.append(title, meta);
        container.appendChild(link);
      }
    }

    async function refreshYandexStatus() {
      try {
        const response = await fetch("/api/status");
        if (!response.ok) {
          setStatus("off", "не удалось проверить");
          return;
        }
        const data = await response.json();
        if (data.yandexConnected) {
          setStatus("on", "подключено");
        } else {
          setStatus("off", "не подключено");
        }
      } catch (error) {
        setStatus("off", "не удалось проверить");
      }
    }

    function fillCards(container, items, render, emptyText) {
      container.replaceChildren();
      if (!items || items.length === 0) {
        container.appendChild(note(emptyText));
        return;
      }
      for (const item of items) {
        container.appendChild(render(item));
      }
    }

    function resetSidebar() {
      document.getElementById("current-role").textContent = "Не выбрана";
      document.getElementById("level-badge").textContent = "—";
      document.getElementById("level-bar").style.width = "0%";
      document.getElementById("score-label").textContent = "0 / 12";
      document.getElementById("gaps-list").replaceChildren(note("Появятся после диагностики"));
      document.getElementById("roadmap-list").replaceChildren(note("Появится после диагностики"));
      document.getElementById("courses-list").replaceChildren(note("Подберём курсы следующим шагом"));
    }

    function note(text) {
      const card = document.createElement("div");
      card.className = "sidebar-card rounded-lg p-3 text-gray-500 text-xs";
      card.textContent = text;
      return card;
    }

    function setStatus(kind, text) {
      const dot = document.getElementById("ai-status-dot");
      const label = document.getElementById("ai-status-text");
      const colors = {
        wait: "bg-gray-500",
        live: "bg-sky-400",
        on: "bg-emerald-500",
        local: "bg-amber-400",
        off: "bg-red-500"
      };
      dot.className = "w-2.5 h-2.5 rounded-full " + (colors[kind] || colors.wait);
      label.textContent = text;
      label.className = kind === "on" ? "text-emerald-400" : kind === "off" ? "text-red-300" : "text-gray-400";
    }
  </script>
</body>
</html>
