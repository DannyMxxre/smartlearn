spring.application.name=mentor

server.port=${PORT:8080}
server.address=0.0.0.0

gigachat.client-id=${GIGACHAT_CLIENT_ID:}
gigachat.scope=${GIGACHAT_SCOPE:}
gigachat.authorization-key=${GIGACHAT_AUTHORIZATION_KEY:}
gigachat.auth-url=${GIGACHAT_AUTH_URL:https://ngw.devices.sberbank.ru:9443}
gigachat.base-url=${GIGACHAT_BASE_URL:https://api.giga.chat}
gigachat.model=${GIGACHAT_MODEL:}
gigachat.temperature=0
gigachat.max-tokens=1800
